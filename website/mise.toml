# The site's toolchain.
#
# `bun.lock` is written in a version-specific format, so the bun that writes it locally has to
# be one the deployment can also read. Keep this pin, `.bun-version`, the `bun-version` in
# `.github/workflows/ci.yml`, and `BUN_VERSION` on Cloudflare on the same value.
#
# Note that 1.4.x is not released — a 1.4 canary writes `lockfileVersion: 2`, which no released
# bun can parse, and every other environment then fails with "Unknown lockfile version".
[tools]
bun = "1.3.14"
