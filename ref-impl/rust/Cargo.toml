[package]
name = "stf"
version = "0.1.0"
edition = "2021"
description = "Reference implementation of STF 1.0 — the Structured Text Format"
license = "CC0-1.0"
repository = "https://github.com/Open-Tech-Foundation/STF"

[lib]
name = "stf"
path = "src/lib.rs"

[[bin]]
name = "stf-conformance"
path = "src/bin/stf_conformance.rs"

[[bin]]
name = "stf-benchmark"
path = "src/bin/benchmark.rs"

[dependencies]
num-bigint = "0.4"
serde_json = { version = "1", features = ["preserve_order"] }

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = true
