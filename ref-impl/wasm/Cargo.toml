[package]
name = "dtxt_wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1.0"
num-bigint = { version = "0.4", features = ["serde"] }
hex = "0.4"
memchr = "2.7"
rustc-hash = "2.1"
ryu = "1.0"
js-sys = "0.3"

[profile.release]
opt-level = 3
lto = true
